<style>
:root{color-scheme:light;
 --bg:#F7F8FA;--panel:#FFFFFF;--line:#E6E8EC;--line2:#F0F1F4;--text:#1A1D23;--muted:#6A7180;--faint:#9BA1AD;
 --sidebar:#111319;--sbtxt:#AAB0BC;--accent:#4F46E5;--accentweak:#EEF0FF;--red:#DC2626;--amber:#B45309;--green:#16A34A;
 --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--sh:0 1px 2px rgba(16,24,40,.05);--r:12px;}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.45;font-variant-numeric:tabular-nums}
a{color:inherit}
.app{display:flex;min-height:100vh}
.side{width:212px;flex:0 0 auto;background:var(--sidebar);color:var(--sbtxt);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{padding:6px 10px 16px}.brand b{font-size:15px;font-weight:700;color:#fff}.brand small{display:block;color:#7C818C;font-size:11px;margin-top:2px}
.nav a{position:relative;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--sbtxt);font-size:13.5px;font-weight:500;text-decoration:none;transition:background .12s,color .12s}
.navico{width:18px;height:18px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:currentColor;opacity:.82}
.navico svg{width:100%;height:100%}
.nav a.on .navico{opacity:1;color:var(--accent)}
.navlbl{line-height:1}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}.nav a.on{background:rgba(255,255,255,.07);color:#fff;font-weight:600}
.nav a.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--accent)}
.sync{margin-top:auto;color:#61656F;font-size:11px;padding:10px}
.main{flex:1;min-width:0;padding:22px clamp(14px,3vw,34px) 44px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.head h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}.head .sub{color:var(--muted);font-size:13px;margin-top:2px}.clock{font-size:13px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:1fr;gap:14px}@media(min-width:820px){.grid.two{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.card.plain{border:none;box-shadow:none;background:transparent;padding:0}
.card h2{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.count{font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:2px 9px;min-width:22px;text-align:center}.count.zero{background:var(--green)}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;box-shadow:var(--sh)}
.hero .lab{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.hero .big{font-size:22px;font-weight:700;margin-top:8px}.hero .meta{color:var(--muted);font-size:13px;margin-top:3px}
.hero .chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.chip{font-size:12.5px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 12px;text-decoration:none;transition:border-color .12s,transform .06s}a.chip:hover{border-color:var(--accent)}a.chip:active{transform:scale(.97)}.chip b{font-weight:700}
.row{display:flex;align-items:center;gap:11px;padding:10px 2px;border-top:1px solid var(--line2)}.row:first-child{border-top:none}
.dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}.bar{width:3px;align-self:stretch;border-radius:3px;min-height:18px;flex:0 0 auto}
.t{font-size:12px;color:var(--faint);width:104px;flex:0 0 auto;font-weight:500}.title{font-weight:600;font-size:14px}.sm{color:var(--muted);font-size:12px}.free .title{color:var(--faint);font-style:italic;font-weight:500}
.pill{font-size:10.5px;font-weight:700;border-radius:6px;padding:3px 8px;flex:0 0 auto}.p-hoch{background:#FEE2E2;color:#B91C1C}.p-mittel{background:#FEF3C7;color:#B45309}.p-niedrig{background:#EEF0F5;color:#5B6472}
.check{width:22px;height:22px;border-radius:6px;border:1.5px solid #CBD1DA;background:#fff;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0}.check:hover{border-color:var(--green);background:#F0FDF4}.check.done{background:var(--green);border-color:var(--green)}
.iconbtn{border:none;background:none;color:var(--faint);cursor:pointer;font-size:15px;padding:4px 7px;border-radius:6px}.iconbtn:hover{color:var(--red);background:#FEF2F2}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}.btn:hover{border-color:#C9CDD6}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:#4338CA}.btn.mini{padding:6px 11px;font-size:12px}.btn[disabled]{opacity:.5}
.form{display:grid;grid-template-columns:1fr;gap:9px}@media(min-width:640px){.form.multi{grid-template-columns:2fr 1fr 1fr auto}}
input,select{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);width:100%}
input:focus,select:focus{outline:2px solid rgba(79,70,229,.25);border-color:var(--accent)}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;color:var(--muted)}
.empty{text-align:center;padding:20px 8px;color:var(--muted);font-size:13px}.empty .big{font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px}
.kdays{width:58px;text-align:center;border-radius:9px;padding:7px 4px;background:var(--accentweak);color:#4338CA;flex:0 0 auto}.kdays.warn{background:#FFF7ED;color:#B45309}.kdays.urgent{background:#FEE2E2;color:#B91C1C}.kdays .n{font-size:19px;font-weight:700;line-height:1}.kdays .u{font-size:10px;text-transform:uppercase;font-weight:600}
.prog{height:8px;background:var(--line2);border-radius:999px;overflow:hidden}.prog>i{display:block;height:100%;background:var(--accent)}.sub2{color:var(--muted);font-size:12px;margin-top:8px}
.timerWrap{display:flex;flex-direction:column;align-items:center;gap:15px;padding:8px 0}
.ring{width:168px;height:168px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--accent) 0deg,#EAECF1 0deg)}.ring .inr{width:142px;height:142px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tmode{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.tnum{font-size:38px;font-weight:700}
.stbox{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--bg);text-align:center}.stbox .n{font-size:26px;font-weight:700}.stbox .l{font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:5px;font-weight:600}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}.chcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}.chbars{display:flex;align-items:flex-end;gap:3px;height:100%}.chbar{width:11px;border-radius:3px 3px 0 0}.chlbl{font-size:10px;color:var(--faint)}
.flash{border:1px solid var(--line);border-radius:12px;padding:26px 16px;text-align:center;background:var(--bg);min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:6px;cursor:pointer;user-select:none}
.flangs{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.fterm{font-size:26px;font-weight:700}.fhint{font-size:12px;color:var(--faint)}.fback{font-size:20px;font-weight:600;color:var(--accent)}
.frow{display:flex;gap:10px;margin-top:14px}.frow .btn{flex:1}.btn.ok{border-color:#BBF7D0;color:#15803D;background:#F0FDF4}.btn.again{border-color:#FED7AA;color:#B45309;background:#FFF7ED}
.decks{display:flex;flex-wrap:wrap;gap:8px}
.deck{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text);transition:all .12s}
.deck b{color:var(--accent);font-weight:800;margin-left:2px}
.deck:hover{border-color:#C9CDD6}
.deck.on{background:var(--accent);border-color:var(--accent);color:#fff}
.deck.on b{color:#fff}
.inforow{display:flex;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line)}
.inforow:last-child{border-bottom:none}
.inforow .d{white-space:nowrap;font-weight:700;color:var(--text);font-size:13px;min-width:104px}
.inforow .x{color:var(--muted);font-size:13px;flex:1;line-height:1.45}
.rastr{display:grid;grid-template-columns:auto 1fr;gap:3px 16px;font-size:13px;align-items:baseline}
.rastr .h{font-weight:700;color:var(--text)}.rastr .p{color:#9aa0ab;font-style:italic;font-size:12px}
.info a{color:var(--accent);text-decoration:none}.info a:hover{text-decoration:underline}
.fmeta{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.trbanner{background:var(--accentweak);color:#4338CA;font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:9px;margin-bottom:12px}
.switch{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--text);cursor:pointer;font-weight:600}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.trlist{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:8px}
.trck{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text);cursor:pointer}
.trck input{width:16px;height:16px;accent-color:var(--accent)}
.legend{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:11px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.tip{color:var(--muted);font-size:12.5px;margin-top:8px;border-top:1px solid var(--line2);padding-top:9px}
.macbar{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 4px}.mac{display:inline-flex;align-items:baseline;gap:5px;border-radius:8px;padding:7px 12px;font-weight:700}.mac .n{font-size:16px}.mac .u{font-size:10px;font-weight:600;opacity:.8}.mac.kcal{background:#FFF7ED;color:#B45309}.mac.prot{background:#F0FDF4;color:#15803D}
.slot2{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}.slot2 .top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 15px;color:#fff}.slot2 .top .nm{font-weight:700;font-size:15px}.slot2 .top .when{font-size:11px;opacity:.9}.slot2 .mini b{background:rgba(255,255,255,.2);border-radius:6px;padding:3px 8px;font-size:11px;margin-left:6px}
.ing{display:flex;justify-content:space-between;gap:10px;padding:8px 15px;border-top:1px solid var(--line2);font-size:13.5px}.ing:first-of-type{border-top:none}.ing .q{color:var(--muted);font-size:12.5px}
.note{padding:10px 15px;background:var(--bg);font-size:12.5px;color:var(--muted);border-top:1px solid var(--line2)}.note.warn{background:#FFF7ED;color:#B45309}
.tot{display:flex;flex-wrap:wrap;gap:10px}.totbox{flex:1;min-width:130px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg)}.totbox .l{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600}.totbox .v{font-weight:700;font-size:17px;margin-top:4px}.totbox.hi{background:var(--sidebar);border:none;color:#fff}.totbox.hi .l{color:#9BA1AD}
.regel{display:flex;gap:9px;padding:6px 0;font-size:13.5px}.regel .b{color:var(--accent);font-weight:700}
.ttscroll{overflow-x:auto}.tt2{display:grid;grid-template-columns:54px repeat(5,minmax(112px,1fr));grid-auto-rows:44px;gap:6px;min-width:640px}
.tt2 .dh{grid-row:1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted)}.tt2 .dh.today{color:var(--accent);font-weight:700}
.tt2 .tl{grid-column:1;display:flex;flex-direction:column;align-items:flex-end;padding-right:8px}.tt2 .tl .a{font-size:11px;color:var(--text);font-weight:600}.tt2 .tl .b{font-size:9.5px;color:var(--faint)}
.tt2 .fr{background:var(--line2);border-radius:8px}
.tt2 .les{border:none;border-radius:9px;color:#fff;padding:7px 10px;text-align:left;overflow:hidden;position:relative}.tt2 .les .nm{font-weight:700;font-size:13.5px;line-height:1.15}.tt2 .les .rm{font-size:11px;opacity:.92}.tt2 .les .du{position:absolute;top:7px;right:8px;font-size:9px;font-weight:600;background:rgba(255,255,255,.22);border-radius:999px;padding:2px 6px}
.err{color:#B91C1C;font-size:13px}.loading{color:var(--faint);font-size:13px}
@media(max-width:720px){
.app{flex-direction:column}
.side{position:sticky;top:0;left:0;right:0;bottom:auto;width:100%;height:auto;flex-direction:row;align-items:stretch;gap:0;padding:0;overflow-x:auto;overflow-y:hidden;z-index:50;border-bottom:1px solid #23262e;box-shadow:0 4px 16px rgba(0,0,0,.22);-webkit-overflow-scrolling:touch}
.brand,.sync{display:none}
.nav{display:flex;flex-direction:row;flex:1;gap:0}
.nav a{flex:0 0 auto;flex-direction:row;justify-content:center;align-items:center;gap:7px;padding:12px 15px;border-radius:0;font-size:13px;font-weight:600;color:#9aa0ab;white-space:nowrap}
.nav a:hover{background:transparent;color:#c7ccd4}
.nav a.on{background:rgba(255,255,255,.06);color:#fff;box-shadow:inset 0 -2px 0 var(--accent)}
.nav a.on::before{display:none}
.nav a.on .navico{color:var(--accent)}
.navico{width:19px;height:19px;opacity:.9}
.main{padding:16px 15px 40px}
.head h1{font-size:21px}
.card,.hero{border-radius:14px}
.btn{padding:11px 16px;font-size:14px}
input,select,textarea{font-size:16px}
.check{width:26px;height:26px}
.mplan .row{padding:9px 2px}
}
</style>
</head>

<script>
/* ---------- SUPABASE ---------- */
const SB_URL="https://tafksekafwihvrwxxzdh.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhZmtzZWthZndpaHZyd3h4emRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNjYxNjAsImV4cCI6MjEwMzk0MjE2MH0.25GTHOHZikQAIKkk7SCtBLHyc3fX9KWMNC6RBFJ0dXQ";
const SBH={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"};
async function sbGet(tbl,qs){const r=await fetch(SB_URL+"/rest/v1/"+tbl+"?"+(qs||"select=*"),{headers:SBH});if(!r.ok)throw new Error(await r.text());return r.json();}
async function sbInsert(tbl,obj){const r=await fetch(SB_URL+"/rest/v1/"+tbl,{method:"POST",headers:{...SBH,Prefer:"return=representation"},body:JSON.stringify(obj)});if(!r.ok)throw new Error(await r.text());return (await r.json())[0];}
async function sbPatch(tbl,id,obj){const r=await fetch(SB_URL+"/rest/v1/"+tbl+"?id=eq."+id,{method:"PATCH",headers:{...SBH,Prefer:"return=representation"},body:JSON.stringify(obj)});if(!r.ok)throw new Error(await r.text());return r.json();}
async function sbDelete(tbl,id){const r=await fetch(SB_URL+"/rest/v1/"+tbl+"?id=eq."+id,{method:"DELETE",headers:SBH});if(!r.ok)throw new Error(await r.text());}

/* ---------- BASICS ---------- */
const two=n=>String(n).padStart(2,"0");
const isoLocal=d=>d.getFullYear()+"-"+two(d.getMonth()+1)+"-"+two(d.getDate());
const todayISO=()=>isoLocal(new Date());
const SCHOOL_START="2026-09-02";
const isFerien=()=>todayISO()<SCHOOL_START;
const daysUntil=iso=>{const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(iso+"T00:00:00")-t)/86400000)};
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function deckStats(){const m={};STATE.vo.forEach(v=>{const k=v.sprache||"—";if(!m[k])m[k]={total:0,due:0};m[k].total++;if(!v.next||v.next<=todayISO())m[k].due++;});return m;}
function deckOrder(keys){return keys.sort((a,b)=>{const ra=/^Le[çc]on\s*(\d+)/i.exec(a),rb=/^Le[çc]on\s*(\d+)/i.exec(b);if(ra&&rb)return +ra[1]-+rb[1];if(ra)return -1;if(rb)return 1;return a<b?-1:1;});}
function getTrainer(){const t=lsGet("lc_trainer",{});return {on:!!t.on,klausur:t.klausur||"1. Klausur",lessons:Array.isArray(t.lessons)?t.lessons:[],daily:+t.daily||30,datum:t.datum||""};}
function dailyState(){const d=todayISO();let s=lsGet("lc_daily",{});if(s.date!==d){s={date:d,done:0};lsSet("lc_daily",s);}return s;}
function dailyTarget(){const tr=getTrainer();return tr.on?tr.daily:DAILY_DEFAULT;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const x=a[i];a[i]=a[j];a[j]=x;}return a;}
function dailyPool(){const tr=getTrainer();if(tr.on&&tr.lessons.length)return STATE.vo.filter(v=>tr.lessons.includes(v.sprache));return STATE.vo.slice();}
function buildDaily(){const s=dailyState(),target=dailyTarget();const rem=Math.max(0,target-(s.done||0));if(rem<=0)return [];const t=todayISO();const pool=dailyPool();const due=shuffle(pool.filter(v=>!v.next||v.next<=t));const notdue=shuffle(pool.filter(v=>v.next&&v.next>t));return due.concat(notdue).slice(0,rem);}
function buildSession(){if(VOKMODE==="daily")return buildDaily();return shuffle(STATE.vo.filter(v=>v.sprache===VOKMODE));}

   try{const r=await sbInsert("klausuren",{fach:fa,thema:th,datum:dt,prep:"Nicht begonnen"});STATE.kl.push({id:r.id,fach:r.fach,thema:r.thema||"",datum:r.datum||"",prep:r.prep||"Nicht begonnen"});route();}catch(e){btn.disabled=false;btn.textContent="Speichern";alert("Speichern fehlgeschlagen.")}};}
 else if(name==="vokabeln"){VOK=buildSession();VOKi=0;VOKrev=false;renderFlash();
   document.querySelectorAll("[data-sess]").forEach(b=>b.onclick=()=>{VOKMODE=b.dataset.sess;route();});
   const trOn=document.getElementById("tr_on");if(trOn)trOn.onchange=()=>{const cfg=document.getElementById("trcfg");if(cfg)cfg.style.display=trOn.checked?"":"none";if(!trOn.checked){const t=getTrainer();t.on=false;lsSet("lc_trainer",t);route();}};
   const trSave=document.getElementById("tr_save");if(trSave)trSave.onclick=()=>{const les=Array.from(document.querySelectorAll(".trles:checked")).map(x=>x.value);const t={on:true,klausur:val("tr_kl"),daily:+val("tr_daily")||30,datum:val("tr_datum"),lessons:les};lsSet("lc_trainer",t);VOKMODE="daily";route();};
   document.getElementById("v_add").onclick=async()=>{const b=val("v_begr"),m=val("v_bed");if(!b||!m)return;let sp=val("v_spr");if(sp==="__new"){sp=(prompt("Name der Lektion / Sprache?")||"").trim();if(!sp)return;}const btn=document.getElementById("v_add");btn.disabled=true;btn.textContent="Speichert…";
   try{const r=await sbInsert("vokabeln",{begriff:b,bedeutung:m,sprache:sp,level:0,next:todayISO()});STATE.vo.push({id:r.id,begriff:r.begriff,bedeutung:r.bedeutung||"",sprache:r.sprache||"",level:0,next:r.next||todayISO()});route();}catch(e){btn.disabled=false;btn.textContent="Speichern";alert("Speichern fehlgeschlagen.")}};}
 else if(name==="vorbereitung"){const add=()=>{const v=val("c_txt");if(!v)return;const l=lsGet("lc_chk",[]);l.push({id:Date.now().toString(36),text:v,done:false});lsSet("lc_chk",l);route();};document.getElementById("c_add").onclick=add;document.getElementById("c_txt").onkeydown=e=>{if(e.key==="Enter")add()};}
 else if(name==="fokus"){bindTimer();}}

window.addEventListener("hashchange",route);
setInterval(()=>{const n=new Date();document.getElementById("clock").textContent=two(n.getHours())+":"+two(n.getMinutes())},1000);
document.getElementById("clock").textContent=(()=>{const n=new Date();return two(n.getHours())+":"+two(n.getMinutes())})();
if(!location.hash)location.hash="#/dashboard";
async function init(){try{await loadAll();}catch(e){STATE.error=e&&e.message?e.message:String(e);}route();}
window.init=init;init();
</script>
</body>
