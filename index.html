<style>
:root{color-scheme:light;
 --bg:#F5F6F8;--panel:#FFFFFF;--line:#E6E8EC;--line2:#F0F1F4;--text:#1A1D23;--muted:#6A7180;--faint:#9BA1AD;
 --sidebar:#111319;--sbtxt:#AAB0BC;--accent:#4F46E5;--accent2:#4338CA;--accentweak:#EEF0FF;--red:#DC2626;--redweak:#FEE2E2;--amber:#B45309;--amberweak:#FEF3C7;--green:#16A34A;--greenweak:#DCFCE7;
 --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--sh:0 1px 2px rgba(16,24,40,.05);--sh2:0 8px 30px rgba(16,24,40,.12);--r:12px;--nav-h:60px;}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.45;font-variant-numeric:tabular-nums;overscroll-behavior-y:none}
a{color:inherit}button{font-family:inherit}
.app{display:flex;min-height:100vh}
/* ---------- Sidebar (Desktop) ---------- */
.side{width:220px;flex:0 0 auto;background:var(--sidebar);color:var(--sbtxt);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{padding:6px 10px 14px;display:flex;align-items:center;gap:10px}.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#6366F1,#8B5CF6);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px}.brand b{font-size:14.5px;font-weight:700;color:#fff;display:block}.brand small{display:block;color:#7C818C;font-size:11px;margin-top:1px}
.navgrp{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#5D626D;padding:12px 12px 4px}
.nav a{position:relative;display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:8px;color:var(--sbtxt);font-size:13.5px;font-weight:500;text-decoration:none;transition:background .12s,color .12s}
.navico{width:18px;height:18px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:currentColor;opacity:.82}.navico svg{width:100%;height:100%}
.nav a.on .navico{opacity:1;color:#818CF8}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}.nav a.on{background:rgba(255,255,255,.07);color:#fff;font-weight:600}
.nav a.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:#818CF8}
.nav .nbadge{margin-left:auto;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}.nav .nbadge.hot{background:var(--red)}
.sync{margin-top:auto;color:#61656F;font-size:11px;padding:10px;line-height:1.5}
.main{flex:1;min-width:0;padding:22px clamp(14px,3vw,34px) 44px;max-width:1240px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.head h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:10px}.head .sub{color:var(--muted);font-size:13px;margin-top:2px}.clock{font-size:13px;color:var(--muted);font-weight:500}
.backlink{font-size:12.5px;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:4px;margin-bottom:8px}.backlink:hover{color:var(--accent)}
/* ---------- Layout ---------- */
.grid{display:grid;grid-template-columns:1fr;gap:14px}@media(min-width:860px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:1fr 1fr 1fr}.span2{grid-column:1/-1}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);min-width:0}
.card.plain{border:none;box-shadow:none;background:transparent;padding:0}
.card h2{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 .hlink{font-size:11.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--accent);text-decoration:none}
.count{font-size:11.5px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:2px 8px;min-width:22px;text-align:center}.count.zero{background:var(--green)}.count.hot{background:var(--red)}
.mt{margin-top:14px}
/* ---------- Hero ---------- */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero .lab{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hero .big{font-size:22px;font-weight:700;margin-top:8px;letter-spacing:-.01em}.hero .meta{color:var(--muted);font-size:13px;margin-top:3px}
.hero .chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.chip{font-size:12.5px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 12px;text-decoration:none;transition:border-color .12s,transform .06s;display:inline-flex;align-items:center;gap:5px}a.chip:hover{border-color:var(--accent)}a.chip:active{transform:scale(.97)}.chip b{font-weight:700}.chip.warn{background:var(--amberweak);border-color:#FDE68A;color:#92400E}.chip.hot{background:var(--redweak);border-color:#FECACA;color:#991B1B}.chip.ok{background:var(--greenweak);border-color:#BBF7D0;color:#166534}
/* Klausurphase */
.kphase{border-radius:var(--r);padding:16px 18px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#B91C1C,#DC2626 55%,#EA580C);box-shadow:0 8px 24px rgba(220,38,38,.25);position:relative;overflow:hidden}
.kphase.warn{background:linear-gradient(135deg,#B45309,#D97706 55%,#F59E0B);box-shadow:0 8px 24px rgba(217,119,6,.25)}
.kphase.soft{background:linear-gradient(135deg,#3730A3,#4F46E5 55%,#6366F1);box-shadow:0 8px 24px rgba(79,70,229,.25)}
.kphase .lab{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.kphase .row2{display:flex;align-items:center;gap:16px;margin-top:8px;flex-wrap:wrap}
.kphase .cnt{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.03em}.kphase .cnt small{font-size:13px;font-weight:600;opacity:.85;margin-left:4px;letter-spacing:0}
.kphase .ttl{font-size:17px;font-weight:700}.kphase .sub{font-size:12.5px;opacity:.9;margin-top:2px}
.kphase .prog{background:rgba(255,255,255,.25);margin-top:12px}.kphase .prog>i{background:#fff}
.kphase .today{margin-top:10px;font-size:13px;background:rgba(255,255,255,.14);border-radius:9px;padding:9px 12px;display:flex;gap:8px;align-items:flex-start}.kphase .today b{white-space:nowrap}
.kphase a.kbtn{display:inline-block;margin-top:10px;background:#fff;color:#7F1D1D;font-weight:700;font-size:12.5px;border-radius:8px;padding:7px 12px;text-decoration:none}.kphase.soft a.kbtn{color:#312E81}.kphase.warn a.kbtn{color:#78350F}
.kphase .more{font-size:12px;opacity:.9;margin-top:8px}
/* ---------- Rows ---------- */
.row{display:flex;align-items:center;gap:11px;padding:10px 2px;border-top:1px solid var(--line2)}.row:first-child{border-top:none}.row.clickable{cursor:pointer;border-radius:8px;margin:0 -6px;padding-left:8px;padding-right:8px}.row.clickable:hover{background:var(--bg)}
.dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}.bar{width:3px;align-self:stretch;border-radius:3px;min-height:18px;flex:0 0 auto}
.t{font-size:12px;color:var(--faint);width:104px;flex:0 0 auto;font-weight:500}.title{font-weight:600;font-size:14px}.sm{color:var(--muted);font-size:12px}.free .title{color:var(--faint);font-style:italic;font-weight:500}
.pill{font-size:10.5px;font-weight:700;border-radius:6px;padding:3px 8px;flex:0 0 auto;white-space:nowrap}.p-hoch{background:#FEE2E2;color:#B91C1C}.p-mittel{background:#FEF3C7;color:#B45309}.p-niedrig{background:#EEF0F5;color:#5B6472}.p-todo{background:#E0E7FF;color:#3730A3}.p-ha{background:#DBEAFE;color:#1E40AF}.p-gray{background:#EEF0F5;color:#5B6472}.p-green{background:#DCFCE7;color:#166534}.p-red{background:#FEE2E2;color:#B91C1C}.p-amber{background:#FEF3C7;color:#B45309}
.over{color:var(--red);font-weight:600}
.check{width:22px;height:22px;border-radius:6px;border:1.5px solid #CBD1DA;background:#fff;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0}.check:hover{border-color:var(--green);background:#F0FDF4}.check.done{background:var(--green);border-color:var(--green)}
.iconbtn{border:none;background:none;color:var(--faint);cursor:pointer;font-size:15px;padding:4px 7px;border-radius:6px;line-height:1}.iconbtn:hover{color:var(--red);background:#FEF2F2}.iconbtn.edit:hover{color:var(--accent);background:var(--accentweak)}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none;line-height:1.2}.btn:hover{border-color:#C9CDD6}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent2)}.btn.danger{color:var(--red);border-color:#FECACA;background:#FFF5F5}.btn.mini{padding:6px 11px;font-size:12px}.btn.wide{width:100%}.btn[disabled]{opacity:.5;pointer-events:none}.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.form{display:grid;grid-template-columns:1fr;gap:9px}@media(min-width:640px){.form.multi{grid-template-columns:2fr 1fr 1fr auto}.form.c2{grid-template-columns:1fr 1fr}.form.c3{grid-template-columns:1fr 1fr 1fr}.form.c4{grid-template-columns:1fr 1fr 1fr 1fr}}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);width:100%}
textarea{min-height:90px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(79,70,229,.25);border-color:var(--accent)}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;color:var(--muted)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}.seg button{border:none;background:transparent;padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}.seg button.on{background:#fff;color:var(--text);box-shadow:var(--sh)}
.quick{display:flex;gap:6px;flex-wrap:wrap}.quick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}.quick button:hover,.quick button.on{border-color:var(--accent);color:var(--accent);background:var(--accentweak)}
.empty{text-align:center;padding:20px 8px;color:var(--muted);font-size:13px}.empty .big{font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px}
.grp{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:12px 2px 4px}.grp.over{color:var(--red)}
.kdays{width:58px;text-align:center;border-radius:9px;padding:7px 4px;background:var(--accentweak);color:#4338CA;flex:0 0 auto}.kdays.warn{background:#FFF7ED;color:#B45309}.kdays.urgent{background:#FEE2E2;color:#B91C1C}.kdays.past{background:var(--line2);color:var(--muted)}.kdays .n{font-size:19px;font-weight:700;line-height:1}.kdays .u{font-size:10px;text-transform:uppercase;font-weight:600}
.prog{height:8px;background:var(--line2);border-radius:999px;overflow:hidden}.prog>i{display:block;height:100%;background:var(--accent);transition:width .3s}.prog.g>i{background:var(--green)}.sub2{color:var(--muted);font-size:12px;margin-top:8px}
/* ---------- Klausur cards ---------- */
.kcard{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--sh);text-decoration:none;color:inherit;transition:border-color .12s,transform .08s;margin-bottom:10px}.kcard:hover{border-color:var(--accent)}.kcard:active{transform:scale(.995)}
.kcard .kd{width:64px;flex:0 0 auto;text-align:center;border-radius:10px;padding:8px 4px}.kcard .kd .n{font-size:24px;font-weight:800;line-height:1}.kcard .kd .u{font-size:10px;font-weight:700;text-transform:uppercase;opacity:.8}
.kcard .kb{flex:1;min-width:0}.kcard .kt{font-weight:700;font-size:15px}.kcard .km{font-size:12.5px;color:var(--muted);margin-top:2px}.kcard .prog{margin-top:8px}
.kcard .kr{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.kcard .pts{font-size:22px;font-weight:800;color:var(--accent)}
.khead{border-radius:14px;padding:20px 22px;color:#fff;margin-bottom:14px;position:relative;overflow:hidden}
.khead .kl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.khead .kt{font-size:24px;font-weight:800;margin-top:4px;letter-spacing:-.02em}.khead .km{font-size:13px;opacity:.9;margin-top:4px}
.khead .kcnt{position:absolute;right:22px;top:18px;text-align:right}.khead .kcnt .n{font-size:46px;font-weight:800;line-height:1;letter-spacing:-.03em}.khead .kcnt .u{font-size:11px;font-weight:700;text-transform:uppercase;opacity:.85}
.khead .kacts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.khead .btn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff}.khead .btn:hover{background:rgba(255,255,255,.25)}.khead .btn.white{background:#fff;color:#1A1D23;border-color:#fff}
.tl{position:relative;padding-left:22px}.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tls{position:relative;padding:6px 0 10px}.tls::before{content:"";position:absolute;left:-19px;top:11px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #C9CDD6}
.tls.done::before{background:var(--green);border-color:var(--green)}.tls.now::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accentweak)}.tls.past::before{background:#C9CDD6;border-color:#C9CDD6}
.tls .d{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}.tls.now .d{color:var(--accent)}.tls .x{font-size:13.5px;font-weight:600;margin-top:1px}.tls .y{font-size:12.5px;color:var(--muted)}
.thema{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line2)}.thema:first-child{border-top:none}.thema .tx{flex:1;font-size:14px;font-weight:500}.thema.done .tx{text-decoration:line-through;color:var(--faint)}
.matl{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line2)}.matl a{color:var(--accent);text-decoration:none;font-weight:600;font-size:13.5px}.matl a:hover{text-decoration:underline}.matl .u{font-size:11px;color:var(--faint);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptsel{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.ptsel button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 0;font-weight:700;font-size:14px;cursor:pointer}.ptsel button.on{background:var(--accent);color:#fff;border-color:var(--accent)}.ptsel button:hover{border-color:var(--accent)}
.pbig{font-size:52px;font-weight:800;line-height:1;letter-spacing:-.03em}.pnote{font-size:13px;color:var(--muted);margin-top:4px}
/* ---------- Vokabeln ---------- */
.ringwrap{display:flex;align-items:center;gap:18px}.ring2{position:relative;width:96px;height:96px;flex:0 0 auto}.ring2 svg{transform:rotate(-90deg)}.ring2 .rn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring2 .rn b{font-size:22px;font-weight:800;line-height:1}.ring2 .rn small{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;margin-top:2px}
.streak{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px}.streak .fl{font-size:18px}.streak.cold{color:var(--muted)}
.flash{border:1px solid var(--line);border-radius:12px;padding:26px 16px;text-align:center;background:var(--bg);min-height:160px;display:flex;flex-direction:column;justify-content:center;gap:6px;cursor:pointer;user-select:none}
.flangs{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.fterm{font-size:26px;font-weight:700}.fhint{font-size:12px;color:var(--faint)}.fback{font-size:20px;font-weight:600;color:var(--accent)}
.frow{display:flex;gap:10px;margin-top:14px}.frow .btn{flex:1;padding:12px}.btn.ok{border-color:#BBF7D0;color:#15803D;background:#F0FDF4}.btn.again{border-color:#FED7AA;color:#B45309;background:#FFF7ED}
.decks{display:flex;flex-wrap:wrap;gap:8px}.deck{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text);transition:all .12s}.deck b{color:var(--accent);font-weight:800;margin-left:2px}.deck:hover{border-color:#C9CDD6}.deck.on{background:var(--accent);border-color:var(--accent);color:#fff}.deck.on b{color:#fff}
.fmeta{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.trbanner{background:var(--accentweak);color:#4338CA;font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:9px;margin-bottom:12px}
.switch{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--text);cursor:pointer;font-weight:600}.switch input{width:18px;height:18px;accent-color:var(--accent)}
.trlist{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:8px}.trck{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text);cursor:pointer}.trck input{width:16px;height:16px;accent-color:var(--accent)}
/* ---------- Stats ---------- */
.stbox{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--bg);text-align:center}.stbox .n{font-size:26px;font-weight:800;letter-spacing:-.02em}.stbox .l{font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:5px;font-weight:600}
.strow{display:flex;gap:10px;flex-wrap:wrap}.strow .stbox{flex:1;min-width:110px}
.chart{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:10px}.chcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}.chbars{display:flex;align-items:flex-end;gap:3px;height:100%}.chbar{width:12px;border-radius:3px 3px 0 0;min-height:2px}.chlbl{font-size:10px;color:var(--faint)}.chval{font-size:10px;color:var(--muted);font-weight:600}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow-x:auto;padding-bottom:4px}.heat i{width:12px;height:12px;border-radius:3px;background:var(--line2)}.heat i.l1{background:#C7D2FE}.heat i.l2{background:#818CF8}.heat i.l3{background:#4F46E5}.heat i.l4{background:#312E81}.heat i.today{outline:2px solid var(--text);outline-offset:-2px}
.legend{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:11px;color:var(--muted);flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:22px}.spark i{width:5px;border-radius:2px;background:#C7D2FE}.spark i.hi{background:var(--accent)}

 if(hasT){const from=Math.max(1,Math.min(d,10));const days=[];for(let i=from;i>=3;i--)days.push(D(i));const per=Math.max(1,Math.ceil(open.length/Math.max(1,days.length)));let idx=0;for(const dd of days){const chunk=open.slice(idx,idx+per);if(!chunk.length)break;steps.push({date:dd,label:chunk.map(x=>x.text).join(" · "),sub:"Üben",kind:"t",themen:chunk});idx+=per;}}

 return '<div class="hero"><div class="lab"><span class="pulse" style="background:#16A34A"></span>Ernährung — Schultag</div><div class="big">~'+t.tagK+' kcal · ~'+t.tagP+' g Protein / Tag</div><div class="meta">'+esc(ERN.profil)+'</div></div><div class="card"><h2>Der Schultag</h2>'+slots+'<div class="tot"><div class="totbox"><div class="l">Schule</div><div class="v">'+t.schuleK+' kcal · '+t.schuleP+' g</div></div><div class="totbox"><div class="l">+ Abend</div><div class="v">~'+t.abendK+' kcal</div></div><div class="totbox hi"><div class="l">Tag</div><div class="v">~'+t.tagK+' kcal · '+t.tagP+' g</div></div></div></div>';};

/* ---------- EINSTELLUNGEN ---------- */
V.einstellungen=()=>{const tg=+setting("vokabel_tagesziel",15)||15;const rt=setting("erinnerung_uhrzeit","18:00");const perm=("Notification" in window)?Notification.permission:"unsupported";const standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;
 const db='<div class="card"><h2>Datenbank</h2>'+(STATE.dbReady?'<div class="banner info" style="margin:0">✓ Alle v2-Tabellen vorhanden — Streak, Noten, Klausur-Details sind geräteübergreifend.</div>':'<div class="banner warn" style="margin:0 0 10px">Das DB-Update fehlt noch. Solange werden Noten, Streak und Klausur-Notizen nur lokal gespeichert.</div><ol class="hint" style="padding-left:18px;line-height:1.8"><li>Supabase-Dashboard öffnen → Projekt <b>tafksekafwihvrwxxzdh</b></li><li>Links <b>SQL Editor</b> → <b>New query</b></li><li>Inhalt von <b>01_supabase_migration_v2.sql</b> einfügen → <b>Run</b></li><li>Diese Seite neu laden</li></ol>')+'<div class="quick" style="margin-top:10px">'+V2TABLES.map(t=>'<button style="cursor:default;'+(STATE.v2[t]?"border-color:#BBF7D0;color:#166534;background:#F0FDF4":"border-color:#FECACA;color:#991B1B;background:#FFF5F5")+'">'+(STATE.v2[t]?"✓":"✕")+' '+t+'</button>').join("")+'</div></div>';
 const vok='<div class="card mt"><h2>Vokabeln</h2><div class="form c2"><label class="fld">Tagesziel (Pflicht)<input id="s_target" type="number" min="5" step="5" value="'+tg+'"></label><label class="fld">Abend-Erinnerung um<input id="s_time" type="time" value="'+esc(rt)+'"></label></div><div class="hint" style="margin-top:8px">Streak zählt Schultage (Mo–Fr) mit erreichtem Ziel; Wochenenden unterbrechen ihn nicht, zählen aber, wenn du lernst.</div><button class="btn primary mini" id="s_save" style="margin-top:10px">Speichern</button></div>';
 const notif='<div class="card mt"><h2>Benachrichtigungen</h2><div class="hint">Erinnerungen, solange das Cockpit offen ist (auch im Hintergrund als installierte App): Vokabel-Abendcheck, Klausur-Countdown (14/7/3/1 Tage), Hausaufgaben für morgen, Fokus-Timer.</div><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+(perm==="granted"?'<span class="pill p-green">✓ erlaubt</span><button class="btn mini" id="s_testnotif">Test senden</button>':perm==="denied"?'<span class="pill p-red">blockiert — in den Browser-Einstellungen für diese Seite erlauben</span>':perm==="unsupported"?'<span class="pill p-gray">Browser unterstützt keine Benachrichtigungen</span>':'<button class="btn primary mini" id="s_notif">Benachrichtigungen erlauben</button>')+'</div><div class="hint" style="margin-top:10px">Aufs Handy kommen die Klausurtermine zusätzlich über den Google Kalender (7 Tage / 1 Tag / 2 Std. vorher) und das 17-Uhr-Review.</div></div>';
 const pwa='<div class="card mt"><h2>Als App installieren</h2>'+(standalone?'<div class="banner info" style="margin:0">✓ Läuft als installierte App.</div>':'<div class="hint"><b>iPhone:</b> Safari → Teilen → „Zum Home-Bildschirm“.<br><b>Android:</b> Chrome → ⋮ → „App installieren“ / „Zum Startbildschirm“.<br>Dann startet das Cockpit wie eine App, ohne Browserleiste, und Benachrichtigungen funktionieren zuverlässiger.</div>')+'</div>';
 const misc='<div class="card mt"><h2>Sonstiges</h2><div class="hint">Version '+APP_VERSION+' · Daten: Supabase (tafksekafwihvrwxxzdh) · Routinen: Morgen-Check 6:02 (iServ + WebUntis → Cockpit), Tages-Review 17:00 (Lernplan, Kalender).</div><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn mini" id="s_reload">Daten neu laden</button><button class="btn mini" id="s_clearlocal">Lokalen Cache leeren</button></div></div>';
 return db+vok+notif+pwa+misc;};
function bindEinstellungen(){const q=id=>document.getElementById(id);
 q("s_save").onclick=async()=>{await setSetting("vokabel_tagesziel",+val("s_target")||15);await setSetting("erinnerung_uhrzeit",val("s_time")||"18:00");toast("Gespeichert");route();};
 const n=q("s_notif");if(n)n.onclick=async()=>{const p=await Notification.requestPermission();if(p==="granted"){notify("Benachrichtigungen aktiv","Das Cockpit meldet sich jetzt bei dir.");}route();};
 const t=q("s_testnotif");if(t)t.onclick=()=>notify("Test ✓","So sehen Erinnerungen aus.");
 q("s_reload").onclick=()=>init();q("s_clearlocal").onclick=()=>{["lc_log","lc_log2","lc_settings","lc_noten","lc_daily","lc_trainer","lc_chk","lc_notified"].forEach(k=>localStorage.removeItem(k));toast("Lokaler Cache geleert");init();};}
/* =====================================================================
   EVENTS · ROUTER · BENACHRICHTIGUNGEN · PWA · INIT
   ===================================================================== */
document.addEventListener("click",async e=>{const t=e.target.closest("[data-done],[data-delhw],[data-edithw],[data-delvo],[data-readnews],[data-lesson],[data-free]");if(!t)return;
 if(t.dataset.readnews!=null){const n=STATE.news.find(x=>x.id===t.dataset.readnews);if(n){n.gelesen=!n.gelesen;route();try{await sbPatch("neuigkeiten",n.id,{gelesen:n.gelesen})}catch(err){}}return;}
 if(t.dataset.done!=null){const h=STATE.hw.find(x=>x.id===t.dataset.done);if(!h)return;const was=h.done;h.done=!was;h.done_at=h.done?new Date().toISOString():null;if(h.done)logAdd("aufgabe",1,h.dauer||0,h.fach||"");route();if(h.done)toast(h.typ==="todo"?"To-do erledigt ✓":"Hausaufgabe erledigt ✓");
  try{try{await sbPatch("hausaufgaben",h.id,{done:h.done,done_at:h.done_at});}catch(e1){await sbPatch("hausaufgaben",h.id,{done:h.done});}}catch(err){h.done=was;route();toast("Speichern fehlgeschlagen",true);}return;}
 if(t.dataset.edithw!=null){const h=STATE.hw.find(x=>x.id===t.dataset.edithw);if(h)editHWModal(h);return;}
 if(t.dataset.delhw!=null){const id=t.dataset.delhw;const h=STATE.hw.find(x=>x.id===id);if(!confirm("„"+(h?h.aufgabe:"")+"“ löschen?"))return;STATE.hw=STATE.hw.filter(x=>x.id!==id);route();try{await sbDelete("hausaufgaben",id);toast("Gelöscht");}catch(err){toast("Löschen fehlgeschlagen",true);}return;}
 if(t.dataset.delvo!=null){const id=t.dataset.delvo;if(!confirm("Karte löschen?"))return;STATE.vo=STATE.vo.filter(x=>x.id!==id);route();try{await sbDelete("vokabeln",id)}catch(err){}return;}
 if(t.dataset.lesson!=null){const [d,s]=t.dataset.lesson.split(":").map(Number);lessonModal(d,s,t.dataset.iso||(ROUTE.name==="dashboard"?todayISO():null));return;}
 if(t.dataset.free!=null){const [d,s]=t.dataset.free.split(":").map(Number);freeModal(d,s,t.dataset.iso||(ROUTE.name==="dashboard"?todayISO():null));return;}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

/* ---------- ROUTER ---------- */
const ROUTE={name:"dashboard",sub:"",id:"",query:{}};
function parseRoute(){let h=location.hash.replace(/^#\/?/,"");const qi=h.indexOf("?");let q={};if(qi>=0){new URLSearchParams(h.slice(qi+1)).forEach((v,k)=>q[k]=v);h=h.slice(0,qi);}const parts=h.split("/").filter(Boolean);ROUTE.name=parts[0]||"dashboard";ROUTE.sub=parts[1]||"";ROUTE.id=ROUTE.name==="klausur"?(parts[1]||""):"";ROUTE.query=q;if(!V[ROUTE.name])ROUTE.name="dashboard";}
function route(){parseRoute();const name=ROUTE.name;const needs=!["ernaehrung","info"].includes(name);
 const navName=name==="klausur"?"klausuren":name;renderNav(navName);
 const title=name==="klausur"&&STATE.loaded&&klById(ROUTE.id)?klById(ROUTE.id).fach+"-Klausur":TITLES[name];
 document.getElementById("pageTitle").textContent=title;document.getElementById("pageSub").textContent=new Date().toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"long"});
 const view=document.getElementById("view");
 if(needs&&!STATE.loaded){view.innerHTML=STATE.error?'<div class="card"><div class="err">Speicher nicht erreichbar: '+esc(STATE.error)+'</div><button class="btn" style="margin-top:10px" onclick="init()">Erneut versuchen</button></div>':'<div class="loading">Lade…</div>';return;}
 document.onkeydown=null;
 try{view.innerHTML=V[name]();}catch(e){view.innerHTML='<div class="card"><div class="err">Anzeigefehler: '+esc(e.message)+'</div></div>';console.error(e);return;}
 try{bindPage(name);}catch(e){console.error(e);}
 if(!ROUTE.query.keep)window.scrollTo({top:0});}
function bindPage(name){if(name==="aufgaben")bindAufgaben();else if(name==="klausuren")bindKlausuren();else if(name==="klausur")bindKlausur();else if(name==="noten")bindNoten();else if(name==="vokabeln")bindVokabeln();else if(name==="stundenplan")bindStundenplan();else if(name==="info")bindInfo();else if(name==="fokus")bindTimer();else if(name==="einstellungen")bindEinstellungen();}
window.addEventListener("hashchange",()=>{closeModal();route();});
window.addEventListener("resize",debounce(()=>{if(ROUTE.name==="stundenplan")route();},200));

/* ---------- BENACHRICHTIGUNGEN ---------- */
let SWREG=null;
function notify(title,body,tag){if(!("Notification" in window)||Notification.permission!=="granted")return;const opts={body,tag:tag||("lc-"+Date.now()),icon:"icon-192.png",badge:"icon-192.png",renotify:false};try{if(SWREG&&SWREG.showNotification)SWREG.showNotification(title,opts);else new Notification(title,opts);}catch(e){try{new Notification(title,opts);}catch(e2){}}}
function notifiedToday(){const n=lsGet("lc_notified",{});const t=todayISO();if(n.date!==t)return {date:t,keys:[]};return n;}
function markNotified(key){const n=notifiedToday();n.keys.push(key);lsSet("lc_notified",n);}
function checkReminders(){if(!STATE.loaded||!("Notification" in window)||Notification.permission!=="granted")return;const now=new Date();const hm=two(now.getHours())+":"+two(now.getMinutes());const rt=setting("erinnerung_uhrzeit","18:00");const n=notifiedToday();const t=todayISO();const dow=now.getDay();
 // Vokabeln
 if(hm>=rt&&!n.keys.includes("vok")&&dow>=1&&dow<=5){const d=dailyTarget()-vokDoneToday();if(d>0){notify("Vokabeln: noch "+d+" offen","~10 Minuten und der Streak ("+vokStreak()+" Tage) bleibt.","lc-vok");markNotified("vok");}}
 // Hausaufgaben für morgen
 if(hm>=rt&&!n.keys.includes("hw")){const tom=addDays(t,1);const due=openHW().filter(h=>h.faellig&&h.faellig<=tom);if(due.length){notify(due.length+" Aufgabe"+(due.length>1?"n":"")+" bis morgen",due.slice(0,3).map(h=>h.aufgabe).join(" · "),"lc-hw");markNotified("hw");}}
 // Klausuren
 if(hm>="07:00"){upcomingKL().forEach(k=>{const d=daysUntil(k.datum);const key="kl"+k.id;if([14,7,3,1,0].includes(d)&&!n.keys.includes(key)){const step=klToday(k);notify(d===0?"Heute: "+k.fach+"-Klausur"+(k.uhrzeit?" um "+k.uhrzeit:""):k.fach+"-Klausur in "+d+" Tag"+(d===1?"":"en"),step?step.label:(k.themen.length?"Lernplan im Cockpit öffnen.":"Themen eintragen — dann baut sich dein Lernplan."),"lc-"+key);markNotified(key);}});}}
setInterval(checkReminders,60000);

/* ---------- PWA ---------- */
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").then(r=>{SWREG=r;}).catch(()=>{});});}

/* ---------- CLOCK / REFRESH ---------- */
function tickClock(){const n=new Date();document.getElementById("clock").textContent=two(n.getHours())+":"+two(n.getMinutes());}
setInterval(tickClock,1000);tickClock();
setInterval(()=>{if(ROUTE.name==="dashboard"&&!document.getElementById("mbg")&&!Trun)route();},60000);
let lastActive=Date.now();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){if(Date.now()-lastActive>10*60000&&STATE.loaded)init(true);lastActive=Date.now();checkReminders();}else lastActive=Date.now();});

/* ---------- INIT ---------- */
if(!location.hash)location.hash="#/dashboard";
async function init(silent){if(!silent){STATE.loaded=false;route();}try{await loadAll();STATE.error=null;}catch(e){STATE.error=e&&e.message?e.message:String(e);STATE.loaded=false;}route();setTimeout(checkReminders,1500);}
window.init=init;init();
</script>
